<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Diárias</title>
<meta name="description" content="Chamada diária, custos, vales, pagamentos e relatório da equipe de obra.">
<meta name="theme-color" content="#eceef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diárias">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: app de celular em uma coluna (máx. 520px), cabeçalho fixo no topo e abas fixas embaixo. */
:root{
  --bg:#eceef0; --surface:#ffffff; --surface-2:#f4f5f6; --ink:#1a1e22; --muted:#5b646d; --line:#d5d9dd;
  --accent:#f2b705; --accent-ink:#1a1e22; --accent-text:#8a6400; --accent-soft:#fdf3cf;
  --ok:#1d7f47; --ok-soft:#e1f2e8; --warn:#b25f00; --warn-soft:#fbead7; --bad:#b8382a; --bad-soft:#f8e1de;
  --on-strong:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b1f23; --surface-2:#22272c; --ink:#e7eaec; --muted:#97a0a9; --line:#2e353b;
  --accent:#f5c021; --accent-ink:#15181b; --accent-text:#f5c021; --accent-soft:#3a3210;
  --ok:#55c486; --ok-soft:#173326; --warn:#f0a24a; --warn-soft:#3a2a14; --bad:#f07565; --bad-soft:#3d1d19; --on-strong:#15181b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b1f23; --surface-2:#22272c; --ink:#e7eaec; --muted:#97a0a9; --line:#2e353b;
  --accent:#f5c021; --accent-ink:#15181b; --accent-text:#f5c021; --accent-soft:#3a3210;
  --ok:#55c486; --ok-soft:#173326; --warn:#f0a24a; --warn-soft:#3a2a14; --bad:#f07565; --bad-soft:#3d1d19; --on-strong:#15181b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:520px;margin-inline:auto}
main.wrap{display:grid;gap:14px;padding-top:14px}
.enter{animation:enter 200ms var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand i{width:10px;height:10px;background:var(--accent);transform:rotate(45deg);display:inline-block}
.sel{appearance:none;min-width:0;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 10px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.iconbtn{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;transition:transform 120ms var(--ease)}
.iconbtn:active{transform:scale(.94)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:8px 16px;font-weight:600;transition:transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-danger{background:var(--bad);color:var(--on-strong);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-block{width:100%}
.link{background:none;border:0;padding:4px 0;color:var(--accent-text);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.banner{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-weight:500}

/* formulários */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.err{font-size:14px;color:var(--bad);font-weight:600}

/* chamada */
.datehead{display:flex;justify-content:space-between;align-items:end;gap:8px}
.datehead h1{font-size:38px;line-height:.95}
.datehead small{display:block;font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.weekbar{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:4px;align-items:center}
.weekbar>button{border:0;background:none;font-size:22px;color:var(--muted);height:56px;padding:0}
.weekbar>button[disabled]{opacity:.25;cursor:default}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 9px;display:grid;justify-items:center;gap:2px;transition:transform 120ms var(--ease)}
.strip button:active{transform:scale(.94)}
.strip button[disabled]{opacity:.35;cursor:default}
.strip button span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.strip button b{font-family:var(--display);font-size:21px;line-height:1}
.strip button i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.strip button i.full{background:var(--ok)}.strip button i.part{background:var(--warn)}
.strip button[aria-current="date"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button[aria-current="date"] span{color:inherit;opacity:.7}
.strip button.today:not([aria-current]) b{color:var(--accent-text)}
.prog{display:grid;gap:6px}
.prog .line{display:flex;justify-content:space-between;font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform 220ms var(--ease)}
.roll{display:grid;gap:8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.person .id{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px;flex:none}
.person .who{min-width:0;flex:1}
.person .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who span{font-size:13px;color:var(--muted)}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.s1{color:var(--ok)}.st.sh{color:var(--warn)}.st.s0{color:var(--bad)}.st.sn{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;height:46px;font-weight:600;transition:transform 120ms var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button[disabled]{cursor:default;transform:none;opacity:.5}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.seg button[aria-pressed="true"][data-v="0.5"]{background:var(--warn);border-color:var(--warn);color:var(--on-strong)}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.seg button[aria-pressed="true"][disabled]{opacity:.75}
.sum{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;display:grid;gap:12px}
.sum .k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .k div{display:grid}
.sum .k span{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.sum .k b{font-family:var(--display);font-size:26px;line-height:1.1}
.sum .cost{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);padding-top:12px}
.sum .cost b{font-family:var(--display);font-size:30px;color:var(--accent)}

/* equipe */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .who{min-width:0;flex:1}
.item .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who span{font-size:13px;color:var(--muted)}
.sectitle{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sectitle h2{font-size:24px}
.confirm{display:grid;gap:10px;background:var(--bad-soft);border-radius:10px;padding:12px}
.confirm.pay{background:var(--accent-soft)}
details.out summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}

/* a pagar */
.owedhead{display:grid;gap:2px}
.owedhead b{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent-text)}
.payrow{border-bottom:1px solid var(--line)}
.payrow:last-child{border-bottom:0}
.payrow>button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px}
.payrow>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.payrow>button b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.payrow .v{font-weight:700;text-align:right}
.payrow .m{font-size:13px;color:var(--muted)}
.chip{justify-self:end;align-self:start;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.chip.open{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.ext{padding:0 14px 14px;display:grid;gap:10px}
.ext table{width:100%;border-collapse:collapse;font-size:14px}
.ext td{padding:7px 0;border-bottom:1px solid var(--line)}
.ext td.r{text-align:right}
.ext tfoot td{border-bottom:0;font-weight:700}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.t1{background:var(--ok-soft);color:var(--ok)}.th{background:var(--warn-soft);color:var(--warn)}.t0{background:var(--bad-soft);color:var(--bad)}
.hist{display:grid;gap:8px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:12px}
.hist div span{color:var(--muted);min-width:0}

/* vazio */
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:28px 18px}
.empty h2{font-size:26px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
/* relatório */
.periods{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.periods button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;transition:transform 120ms var(--ease)}
.periods button:active{transform:scale(.96)}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kgrid .card{padding:12px;display:grid;gap:2px;min-width:0}
.kgrid b{font-family:var(--display);font-size:clamp(20px,6vw,26px);line-height:1.1;overflow-wrap:anywhere}
.kgrid .big{grid-column:1/-1}
.kgrid .big b{font-size:40px;color:var(--accent-text)}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:0 0 8px 8px}
.rtable th:first-child,.rtable td:first-child{text-align:left;padding-left:0}
.rtable td{padding:9px 0 9px 8px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
.rtable td:first-child b{display:block;font-weight:600}
.rtable td:first-child span{font-size:12px;color:var(--muted)}
.rtable tfoot td{font-weight:700}
.days{display:grid;gap:6px}
.dayrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.dayrow .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.dayrow .track i{display:block;height:100%}
.track i.mo,.lmo{background:var(--accent)}
.track i.ex,.lex{background:var(--muted)}
.legend2{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;transition:transform 120ms var(--ease)}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xlist{display:grid}
.xitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.xitem:last-child{border-bottom:0}
.xcat{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent-text)}
.xdesc{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrm{border:0;background:none;width:36px;height:36px;border-radius:6px;font-size:20px;color:var(--muted)}
.stopcard{display:grid;gap:8px;border-style:dashed;border-width:2px}
.stopcard h2{font-size:32px}
.strip button i.stop{background:var(--muted)}
.sum .lines{display:grid;gap:4px;font-size:14px;opacity:.85}
.sum .lines div{display:flex;justify-content:space-between}
.vform{background:var(--surface-2);border-radius:10px;padding:12px}
.form .sel{flex:none;width:100%}
.rlines{display:grid;gap:6px;font-size:14px}
.rlines div{display:flex;justify-content:space-between;gap:12px}
.recibo{display:grid;gap:14px;padding:20px}
.recibo .rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.recibo .rhead h2{font-size:30px;text-transform:uppercase;letter-spacing:.08em}
.recibo .rhead b{font-family:var(--display);font-size:28px}
.recibo p{margin:0;line-height:1.6}
.sign{display:grid;justify-items:center;gap:6px;margin-top:32px;font-weight:600}
.sign span{width:80%;border-top:1px solid var(--ink)}
.copybox{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px;font-family:var(--mono);font-size:12px;color:var(--ink)}
.tabs button{border:0;background:none;height:62px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:8px;height:8px;border-radius:99px;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18);animation:toast 200ms var(--ease)}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}
.toast.bad{background:var(--bad);color:var(--on-strong)}
@media (prefers-reduced-motion: reduce){.enter,.toast{animation:none}.bar i{transition:none}}


/* ===== produção ===== */
.syncbar{background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:6px 16px;font-size:13px;color:var(--muted)}
.syncbar .wrap{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.off{background:var(--warn)}.dot.run{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.top-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px}
.top-sticky .top{position:static;margin-inline:-16px}
.weekstatus{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.weekstatus b{color:var(--ink)}
.weekstatus.closed{background:var(--ok-soft);border-color:transparent;color:var(--ink);justify-content:flex-start;flex-wrap:nowrap;align-items:flex-start}
.weekstatus.closed .ic{color:var(--ok);margin-top:1px}
.weekstatus .link{display:inline-flex;align-items:center;gap:4px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fecharbox{border:2px solid var(--bad)}
.login{margin-top:12px}
.login input{font-size:16px}
.okmsg{font-size:14px;color:var(--ok);font-weight:600}
.account{display:grid;gap:10px}
input,select,textarea{font-size:16px}
@media (prefers-reduced-motion: reduce){.dot.run{animation:none}}

</style>
</head>
<body>
<div class="top-sticky">
  <header class="top"><div class="wrap" id="top"><span class="brand"><i></i>Diárias</span></div></header>
  <div class="syncbar" id="status" hidden></div>
</div>
<main class="wrap" id="app"><div class="card empty"><h2>Abrindo…</h2><p>Carregando o app.</p></div></main>
<nav class="tabs" aria-label="Seções"><div class="wrap" id="tabs"></div></nav>
<div id="toast" aria-live="polite"></div>
<noscript><p style="padding:16px">Ative o JavaScript para usar o Controle de Diárias.</p></noscript>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
